<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalBites — Choose your portal</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="auth">
    <main id="role-screen" class="role-screen">
      <div class="role-card">
        <a class="brand role-brand" href="index.html">
          <span class="brand-mark">L</span>
          <span><strong>LocalBites</strong><small>FARMER CO-OP</small></span>
        </a>
        <span class="role-kicker">WELCOME TO THE CO-OP</span>
        <h1>How will you use LocalBites?</h1>
        <p>Choose a portal, then sign in or create a sample account.</p>
        <div class="role-options">
          <button type="button" data-role="buyer">
            <span aria-hidden="true">&#128722;</span>
            <strong>I'm a Buyer</strong>
            <small>Browse fresh harvests and place orders</small>
            <b>Continue &rarr;</b>
          </button>
          <button type="button" data-role="seller">
            <span aria-hidden="true">&#127793;</span>
            <strong>I'm a Seller</strong>
            <small>Manage your farm and products</small>
            <b>Continue &rarr;</b>
          </button>
        </div>
        <small class="prototype-note">Supabase-backed prototype</small>
      </div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
